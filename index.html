ust be justified afresh each period, starting from zero, is:", ["Flexible budgeting", "Zero-base budgeting", "Master budgeting", "Cash budgeting"], 1, "Zero-base budgeting requires justification of all expenses from a zero base."], [4, "A budget designed to change in accordance with the level of activity attained is a:", ["Fixed budget", "Flexible budget", "Master budget", "Capital budget"], 1, "A flexible budget is recast for different activity levels."], [4, "Material price variance is calculated as:", ["(Standard price - Actual price) x Actual quantity", "(Standard quantity - Actual quantity) x Standard price", "(Standard price - Actual price) x Standard quantity", "(Standard quantity - Actual quantity) x Actual price"], 0, "MPV = (SP - AP) x AQ; the usage variance is (SQ - AQ) x SP."], [4, "Vouching in auditing means:", ["Verification of assets", "Examination of documentary evidence supporting entries in the books", "Checking arithmetical accuracy only", "Valuation of liabilities"], 1, "Vouching checks transactions in the books against supporting documents."], [4, "Appointment of auditors of a company is dealt with in which section of the Companies Act, 2013?", ["Section 139", "Section 141", "Section 143", "Section 177"], 0, "Section 139 covers appointment of auditors."], [4, "Eligibility, qualifications and disqualifications of auditors are given in:", ["Section 139", "Section 141", "Section 143", "Section 177"], 1, "Section 141 deals with eligibility and disqualifications; Section 143 with powers and duties."], [4, "An auditor issues a qualified opinion when the effect of a misstatement is:", ["Material but not pervasive", "Material and pervasive", "Immaterial", "Not identified by management"], 0, "Qualified opinion: material but not pervasive. Adverse opinion: material and pervasive."], [4, "Which Standard on Auditing deals with forming an opinion and reporting on financial statements?", ["SA 700", "SA 230", "SA 500", "SA 550"], 0, "SA 700 covers forming an o al Marketing System", "Contractual Vertical Marketing System", "Horizontal Marketing System"], 1, "UGC NET June 2026, Q15. Correct answer: option B (Administered Vertical Marketing System)."], [6, "Match the LIST-I with LIST-II<br>LIST-I<br>A. Default risk<br>B. Liquidity risk<br>C. Foreign Exchange risk<br>D. Sovereign risk<br>LIST-II<br>I. Adverse foreign currency exchange rate fluctuations.<br>II. Borrower may not pay interest and/or principal amount on time.<br>III. Associated with financial asset purchased in foreign country.<br>IV. Inability to convert security into cash easily.", ["A-I, B-II, C-III, D-IV", "A-II, B-III, C-IV, D-I", "A-II, B-IV, C-I, D-III", "A-IV, B-III, C-I, D-II"], 2, "UGC NET June 2026, Q16. Correct answer: option C (A-II, B-IV, C-I, D-III)."], [6, "Match the LIST-I with LIST-II<br>LIST-I<br>A. Walter’s Dividend Model<br>B. Growth rate under Gordon’s model<br>C. Dividend signalling hypothesis<br>D. Information Asymmetry<br>LIST-II<br>I. The gap between information that management possesses and shared with shareholders.<br>II. If a firm has profitable investment opportunities, then its value is maximum when dividend payout ratio is 0%.<br>III. Product of retention ratio and return on equity.<br>IV. Dividend payment provides meaningful information.", ["A-I, B-II, C-III, D-IV", "A-II, B-III, C-IV, D-I", "A-II B-IV, C-I, D-III", "A-III, B-II, C-IV, D-I"], 1, "UGC NET June 2026, Q17. Correct answer: option B (A-II, B-III, C-IV, D-I)."], [6, "Arrange the following financial instruments in increasing order of required rate of return under normal economic conditions.<br>A. Equity Capital<br>B. Corporate Bonds<br>C. Treasury Bills<br>D. Preference Share Capital<br>E. Government Bonds", ["C, E, A, D and B", "D, C, B, E and A", "C, E, B, D and A", "C, A, B, D and E"], 2, "UGC NET June 2026, Q18. Correct answer: option C (C, E, B, D and A)."], [6, "What is the most appropriate order of the operating cycle of a manufacturing company?<br>A. Conversion o e existing companies are combined to form a new company.", ["A-IV, B-III, C-II, D-I", "A-I, B-II, C-III, D-IV", "A-III, B-IV, C-II, D-I", "A-II, B-I, C-IV, D-III"], 0, "UGC NET June 2026, Q22. Correct answer: option A (A-IV, B-III, C-II, D-I)."], [4, "Which of the following statements are NOT true?<br>A. The main objective of vouching is to examine the accounting entries recorded in the books of account with reference to documentary evidence in support thereof.<br>B. Vouching is also known as backbone of auditing.<br>C. Verification of assets implies ‘proving the truth’ or ‘confirmation’ of assets as on date of balance sheet.<br>D. Intangible assets are those assets, which have physical existence.<br>E. One of the objective of vouching is to make assurance as to assets are free from any charge or mortgage.", ["D and E Only", "C, D and E Only", "A, D and E Only.", "A, B and C Only"], 0, "UGC NET June 2026, Q23. Correct answer: option A (D and E Only)."], [4, "Which of the following statements are correct?<br>A. Dividend on equity shares is paid before payment of dividend on preference share.<br>B. Dividend on preference shares is paid after payment of dividend on equity share.<br>C. When a public company desire to raise capital by issuing its shares to the public ,it has to issue a prospectus.<br>D. After the application money ( in the case of issue of equity share) and allotment money, the subsequent instalments are called calls.<br>E. If the face value of the shares is Rs.10 and they are issued at Rs.15, then the issue of shares is at premium of Rs.5.", ["C, D and E Only", "B, D and E Only", "A, B and D Only", "A, B and C Only"], 0, "UGC NET June 2026, Q24. Correct answer: option A (C, D and E Only)."], [4, "Which of the following accounting concept state that, capital of business is treated liability of the business ?", ["Cost concept", "Matching concept", "Accounting period concept", "Business entity concept"], 3, "UGC NET June 2026, Q25. Correct answer: option D (Business entity concept)."], [4, "From the following particulars of Sharma manufactures, calculate Material usage variance?<br>Quantity of materials purchased =3,000 units<br>Value of materials purchased=Rs.9,000<br>Standard quantity of materials required per tonnes of output=30 units<br>Standard rate of materials=Rs.3.50 per unit.<br>Opening stock of materials=0 units<br>Closing stock of materials=500 units<br>Output during the period=80 tonnes.", ["Rs.350 Adverse", "Rs.300 Adverse", "Rs.350 Favourable", "Rs.250 Favourable"], 0, "UGC NET June 2026, Q26. Material usage variance = (SQ − AQ) × SP. SQ = 80 × 30 = 2,400 units; AQ used = 3,000 − 500 closing = 2,500 units. (2,400 − 2,500) × Rs.3.50 = Rs.350 Adverse."], [4, "A,B and C are partners sharing profits in the ratio of 3:2:1.A retires and his shares is taken up by B &amp; C in the ratio of 3:2.Calculate the new profit sharing ratio of B &amp; C.", ["new profit sharing ratio of B &amp; C =19:11", "new profit sharing ratio of B &amp; C =11:11", "new profit sharing ratio of B &amp; C =11:19", "new profit sharing ratio of B &amp; C =19:19"], 0, "UGC NET June 2026, Q27. A's share = 3/6. B gets 3/5 of it = 3/10 and C gets 2/10. New B = 2/6 + 3/10 = 19/30; new C = 1/6 + 1/5 = 11/30. Ratio 19:11."], [4, "From the following, calculate the amount transferred to Capital reserve account.<br>400 shares of Rs.10 each on which Rs.8 per shares has been called and Rs.6 per share has been paid were forfeited by ABC Limited. Out of these 300 shares are reissued for Rs.7 each as fully paid.", ["Rs.900", "Rs.600", "Rs.400", "Zero"], 0, "UGC NET June 2026, Q28. Forfeited amount per share = Rs.6, so for 300 reissued shares = Rs.1,800. Reissued at Rs.7 for fully paid Rs.10, a discount of Rs.3 × 300 = Rs.900. Capital reserve = 1,800 − 900 = Rs.900."], [4, "Which of the following is NOT a method of calculating purchase consideration for amalgamation?", ["Net payment method", "Net assets method", "Lumpsum method", "Net realisable value method"], 3, "UGC NET June 2026, Q29. Correct answer: option D (Net realisable value method)."], [4, "ABC Limited has earned a contribution of Rs.2,00,000 and net profit of Rs.1,50,000 on sales of Rs.8,00,000.Calculate its Margin of safety.", ["Rs.6,00,000", "Rs.8,00,000", "Rs.10,00,000", "Rs.4,00,000"], 0, "UGC NET June 2026, Q30. P/V ratio = 2,00,000 ÷ 8,00,000 = 25%. Margin of safety = Profit ÷ P/V ratio = 1,50,000 ÷ 25% = Rs.6,00,000."], [4, "From the following information, calculate inventory turnover ratio:<br>Revenue from operations (sales)=Rs.4,00,000<br>Opening inventory =Rs.50,000<br>Closing inventory =Rs.1,10,000<br>Gross profit ratio= 20% on sales", ["4 times", "5 times", "6 times", "8 times"], 0, "UGC NET June 2026, Q31. COGS = 80% × 4,00,000 = 3,20,000. Average inventory = (50,000 + 1,10,000) ÷ 2 = 80,000. Turnover = 3,20,000 ÷ 80,000 = 4 times."], [9, "Match the LIST-I with LIST-II<br>LIST-I (Development Financial Institution Name)<br>A. Industrial Finance Corporation of India Limited<br>B. Industrial Development Bank of India<br>C. National Bank for Agriculture and Rural Development<br>D. Small Industries Development Bank of India<br>LIST-II (Establishment Year)<br>I. 1948<br>II. 1964<br>III. 1982<br>IV. 1990", ["A-I, B-II, C-III, D-IV", "A-IV, B-III, C-II, D-I", "A-II, B-I, C-IV, D-III", "A-IV, B-III, C-I, D-II"], 0, "UGC NET June 2026, Q32. Correct answer: option A (A-I, B-II, C-III, D-IV)."], [9, "Match the LIST-I with LIST-II<br>LIST-I (Year)<br>A. 1994<br>B. 1995<br>C. 1997<br>D. 2003<br>LIST-II (Reforms in Government Securities Market)<br>I. Introduction of Trading in Government Securities on Stock Exchange<br>II. Introduction of Ways and Means Advances Scheme<br>III. Introduction of Delivery versus Payment System<br>IV. Setting up of Securities Trading Corporation of India", ["A-I, B-II, C-III, D-IV", "A-IV, B-III, C-II, D-I", "A-I, B-IV, C-II, D-III", "A-III, B-II, C-IV, D-I"], 1, "UGC NET June 2026, Q33. Correct answer: option B (A-IV, B-III, C-II, D-I)."], [9, "Arrange the following in chronological order of NSE Milestones:<br>A. Launch of Exchange Traded Funds<br>B. Launch of Mutual Fund Service System<br>C. Commencement of Derivatives Trading in Index Futures<br>D. Launch of Futures and Options on Bank Nifty Index<br>E. Launch of S&amp;P CNX Nifty", ["A, B, C, D, E", "E, D, C, B, A", "C, E, A, B, D", "E, C, A, D, B"], 3, "UGC NET June 2026, Q34. Correct answer: option D (E, C, A, D, B)."], [9, "Arrange the following Acts related to financial sector regulation in India in ascending order on the basis of their year of enactment:<br>A. The Banking Regulation Act<br>B. The Pension Fund Regulatory and Development Authority Act<br>C. Insurance Regulatory and Development Authority of India Act<br>D. The Securitization and Reconstruction of Financial Assets and Enforcement of Security Interest Act<br>E. Securities and Exchange Board Act", ["A, C, E, B, D", "A, E, C, D, B", "B, A, E, D, C", "C, B, E, D, A"], 1, "UGC NET June 2026, Q35. Correct answer: option B (A, E, C, D, B)."], [9, "Which of the following statements are correct?<br>A. The financial systems of most developing countries are characterized by coexistence and cooperation between the formal and informal financial sectors.<br>B. The RBI regulates the capital market and SEBI regulates the money market.<br>C. Formal financial systems consist of financial institutions, financial markets, financial instruments, and financial services.<br>D. The main organized financial markets in India are the money market and the capital market.<br>E. Primary markets are meant for trading in outstanding or existing securities while the secondary market deals in new issues.", ["A, B, C, and D Only", "B, D, and E Only", "C, D, and E only", "A, C, and D Only"], 3, "UGC NET June 2026, Q36. Correct answer: option D (A, C, and D Only)."], [9, "Which of the following principles of Insurance are correct?<br>A. Principle of Causa Proxima.<br>B. Principle of Subrogation.<br>C. Principle of Premium Maximization.<br>D. Principle of Indemnity.<br>E. Principle of Guarantee.", ["A, and D Only", "A, B and C Only", "B, C and D Only", "A, B and D Only"], 3, "UGC NET June 2026, Q37. Correct answer: option D (A, B and D Only)."], [9, "Which committee recommended the establishment of Regional Rural Bank in India:", ["Narasimham Committee", "Goiporia Committee", "L. C. Gupta Committee", "Tarapore Committee"], 0, "UGC NET June 2026, Q38. Correct answer: option A (Narasimham Committee)."], [9, "The Reserve Bank of India started functioning from", ["April 1, 1934", "April 1, 1935", "April 1, 1949", "April 1, 1950"], 1, "UGC NET June 2026, Q39. Correct answer: option B (April 1, 1935)."], [9, "Which of the following technique of monetary control is conducted by way of repurchase agreements (repos and reverse repos) where RBI is the counter-party to all the transactions?", ["Moral Suasion", "Selective Credit Controls", "Liquidity Adjustment Facility", "Open Market Operations"], 2, "UGC NET June 2026, Q40. Correct answer: option C (Liquidity Adjustment Facility)."], [9, "A Non Performing Asset (NPA) in respect of a term loan is a loan where interest and/or instalment of principal remain overdue for a period of more than", ["30 days", "45 days", "60 days", "90 days"], 3, "UGC NET June 2026, Q41. Correct answer: option D (90 days)."], [12, "Match the LIST-I (Rate of TDS) with LIST-II (Nature of income received by Mr. S, a resident in India)<br>LIST-I<br>A. 30%<br>B. 10%<br>C. 20%<br>D. 2%<br>LIST-II<br>I. Rs. 20,000 received as dividend from X Ltd.<br>II. Rs. 15,000 winnings from horse races<br>III. Rs. 50,000 received as insurance commission<br>IV. Rs. 30,000 received as interest on securities and PAN not provided", ["A-II, B-I, C-IV, D-III", "A-I, B-II, C-III, D-IV", "A-IV, B-III, C-II, D-I", "A-III, B-IV, C-I, D-II"], 0, "UGC NET June 2026, Q42. Correct answer: option A (A-II, B-I, C-IV, D-III)."], [12, "Match the LIST-I (Maximum time period for carry forward of losses) with LIST-II (Type of Losses)<br>LIST-I<br>A. Brought forward loss of a firm succeeded by another firm<br>B. Long-term Capital Loss<br>C. Speculation Loss<br>D. Loss from specified business<br>LIST-II<br>I. unlimited<br>II. 4 years<br>III. None<br>IV. 8 years", ["A-I, B-III, C-IV, D-II", "A-IV, B-I, C-II, D-III", "A-I, B-IV, C-III, D-II", "A-III, B-IV, C-II, D-I"], 3, "UGC NET June 2026, Q43. Correct answer: option D (A-III, B-IV, C-II, D-I)."], [12, "Write the correct order of set off and carry forward for various items as given below:<br>A. Unabsorbed depreciation<br>B. Current year capital expenditure on scientific research (to the extent allowed)<br>C. Current year depreciation<br>D. Brought forward business loss<br>E. Unabsorbed capital expenditure on family planning<br>F. Unabsorbed capital expenditure on scientific research", ["B, C, A, D, E, F", "B, C, D, A, F, E", "C, B, D, A, F, E", "C, B, A, D, E, F"], 2, "UGC NET June 2026, Q44. Correct answer: option C (C, B, D, A, F, E)."], [12, "Which of the following is a necessary condition for a property to be taxable under the head ‘Income from House Property’?<br>A. The property should consist of a building or land appurtenant thereto<br>B. It should not be used by the assessee for his business or profession<br>C. The property should be a mortgaged property<br>D. The assessee should be the owner of the property", ["B, C and D only", "A, B and D only", "A, B, C only", "A and D only"], 1, "UGC NET June 2026, Q45. Correct answer: option B (A, B and D only)."], [12, "What conditions must be satisfied to constitute arm’s length price?<br>A. The price is applied in a transaction<br>B. The transaction is between related persons<br>C. The transaction takes place under uncontrolled conditions<br>D. The transaction is between unrelated persons<br>E. The transaction takes place under controlled conditions", ["A, B and C only", "A, D, and E only", "A, C and D only", "A, B and E only"], 2, "UGC NET June 2026, Q46. Correct answer: option C (A, C and D only)."], [12, "X, who is a foreign national (not being a person of Indian origin), came to India for the first time on April 15, 2021. During the financial years 2021-22, 2022-23, 2023-24, 2024-25 and 2025-26, he was in India for 130 days, 80 days, 13 days, 210 days and 75 days respectively. Determine the residential status of X for the assessment year 2026-27.", ["Ordinarily Resident", "Not Ordinarily Resident", "Non-resident", "Information is incomplete"], 1, "UGC NET June 2026, Q47. In 2025-26 he stayed 75 days (60 or more) and 433 days in the 4 preceding years (365 or more), so he is Resident. He was Resident in only 1 of the 10 preceding years (2024-25), so he is Not Ordinarily Resident."], [12, "For claiming income tax exemption by a political party as per Income Tax Act 2025, what is the maximum amount of donation that may be received in cash?", ["Rs. 1,500", "Rs. 2000", "Rs. 5,000", "Rs. 10,000"], 1, "UGC NET June 2026, Q48. Correct answer: option B (Rs. 2000)."], [12, "X owned a residential house which was purchased by him in 1.11.2023 for Rs. 1.8 crore. The market value of the house as on 1.4.2001 was Rs. 30 lakhs. This house was sold by him on 16.7.2025 for Rs. 14 crore. He paid 2% of sale price as commission on transfer and invested Rs. 12 crore on 21.10.2025 for the purchase of the new house. Compute the taxable gains for Tax Year 2025-26.", ["Rs. 11.92 crore", "Rs. 12 crore", "Rs. 10.72 crore", "Rs. 1.72 crore"], 0, "UGC NET June 2026, Q49. Held for less than 24 months, so the house is a short-term asset: no indexation and no exemption for reinvestment. Gain = 14 crore − 28 lakh commission − 1.8 crore cost = Rs.11.92 crore."], [12, "Mrs. A started the business in 2023. Her capital in the business as on 01.04.2024 stood at Rs. 3,00,000. Mr. A (her husband) gifted her a sum of Rs. 2,00,000 on 10.12.2024 which was also invested in the same business on the same date. She earned a profit of Rs. 1,50,000 and Rs. 3,90,000 during the previous years 2024-25 and 2025-26 respectively. Assume that the entire Rs. 1,50,000 profit of 2024-25 was retained and reinvested in the business and there were no other capital changes. What is the amount of income to be clubbed in the hands of Mr. A in the assessment year 2026-27?", ["Rs. 4,50,000", "Rs. 3,90,000", "Rs. 1,20,000", "Rs. 2,70,000"], 2, "UGC NET June 2026, Q50. Income from the gifted capital is clubbed. Capital employed = 3,00,000 + 2,00,000 + 1,50,000 = 6,50,000. Clubbed income = 3,90,000 × 2,00,000 ÷ 6,50,000 = Rs.1,20,000."], [12, "During the previous year, an assessee has incurred a loss from his business amounting to Rs. 1,20,000 whereas his income from house property is Rs. 1,10,000. The assessee in this case can carry forward:", ["Business Loss of Rs. 10,000 only", "Business Loss of Rs. 1,10,000 and claiming full exemption of other income in the current previous year", "Nil Loss", "Business Loss of Rs. 2,30,000 only"], 0, "UGC NET June 2026, Q51. Correct answer: option A (Business Loss of Rs. 10,000 only)."], [8, "Match the LIST-I with LIST-II<br>LIST-I<br>A. Theory of Bureaucracy<br>B. Core Competency<br>C. Scientific Management<br>D. Hawthorne Experiment<br>LIST-II<br>I. Elton Mayo<br>II. C.K. Prahalad and Gary Hamel<br>III. Max Weber<br>IV. Frederick W. Taylor", ["A-III, B-II, C-IV, D-I", "A-III, B-I, C-IV, D-II", "A-I, B-II, C-III, D-IV", "A-IV, B-III, C-II, D-I"], 0, "UGC NET June 2026, Q52. Correct answer: option A (A-III, B-II, C-IV, D-I)."], [8, "Arrange the four steps of behaviour modelling training in the organisation in ascending order :<br>A. Transfer of training<br>B. Social reinforcement<br>C. Role-playing<br>D. Modelling", ["D, C, B, A", "A, C, D, B", "D, B, C, A", "A, D, C, B"], 0, "UGC NET June 2026, Q53. Correct answer: option A (D, C, B, A)."], [8, "Arrange the following stages of Group Development in ascending order -<br>A. Storming<br>B. Adjourning<br>C. Norming<br>D. Performing<br>E. Forming", ["E, A, C, D, B", "E, B, C, D, A", "E, D, C, A, B", "A, E, D, C, B"], 0, "UGC NET June 2026, Q54. Correct answer: option A (E, A, C, D, B)."], [8, "Which of the following statements are correct with regard to People Analytics?<br>A. It is the use of business analytics in human resource.<br>B. It generally makes use of statistical tools and artificial intelligence (AI) in human resource.<br>C. It is used in recruitment and selection only.<br>D. It is a form of organisational structure.", ["A and B only", "B and C only", "A and C only", "A and D only"], 0, "UGC NET June 2026, Q55. Correct answer: option A (A and B only)."], [8, "Which of the following statements are correct with regard to 4 Is of Transformational Leadership?<br>A. Idealized influence is related to providing vision, instilling pride, gaining respect and trust.<br>B. Inspirational motivation is related to communicating high expectations, using symbols to focus efforts and expressing important purposes in simple ways.<br>C. Intellectual stimulation is related to treating each employee individually, and coaching and advising them.<br>D. Individualised consideration is related to promoting intelligence, rationality and careful problem solving.", ["A and B only", "A, B and C only", "B, C and D only", "B and D only"], 0, "UGC NET June 2026, Q56. Correct answer: option A (A and B only)."], [8, "Which of the following is true regarding Two-Factor Theory of Motivation by Herzberg?", ["It has a hierarchy of needs.", "The opposite of satisfaction is no satisfaction.", "The opposite of dissatisfaction is satisfaction.", "There is a single continuum between satisfaction and dissatisfaction."], 1, "UGC NET June 2026, Q57. Correct answer: option B (The opposite of satisfaction is no satisfaction.)."], [8, "The Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal)<br>Act came into force in", ["2011", "2012", "2013", "2014"], 2, "UGC NET June 2026, Q58. Correct answer: option C (2013)."], [8, "Which of B", "B, D, C, E, A", "D, B, C, A, E", "B, C, D, E, A"], 0, "UGC NET June 2026, Q64. Correct answer: option A (D, C, A, E, B)."], [11, "Which of the following are true in case of Lack of Quorum?<br>A. Any fraction of a number cannot be rounded off as one.<br>B. Total strength must not include directors whose places are vacant.<br>C. The meeting automatically stands adjourned to the same day at the same time and place in the next week.<br>D. The adjourned day falls to be a national holiday, the next succeeding day, which is not a national holiday at the same time and place.", ["B, C, and D", "A, B, and C", "A, C, and D", "C and D only"], 0, "UGC NET June 2026, Q65. Correct answer: option A (B, C, and D)."], [11, "In accordance with The Indian Contract Act, 1872, which of the following statements are correct?<br>A. A contract with a minor is voidable at his option.<br>B. A minor can be an agent and is empowered to bind the principal by his acts.<br>C. A person of unsound mind cannot enter into a valid contract.<br>D. An alcoholic person can never enter into a valid contract.<br>E. A contract for the benefit of a minor can be enforced.", ["B and E only", "A, B, C only", "B, C, E only", "A, B, D only"], 0, "UGC NET June 2026, Q66. Correct answer: option A (B and E only)."], [11, "Match the LIST-I with LIST-II<br>LIST-I (Landmark Cases)<br>A. Chinnaya Vs Ramaya<br>B. Mohoribibi Vs Dharmodas Ghose<br>C. Hadley Vs Baxendale<br>D. Dunlop Pneumatic Tyre Co Vs Selfridge<br>LIST-II (Judgment is related to)<br>I. Minor’s agreements<br>II. Doctrine of Privity of Contract<br>III. Consideration<br>IV. Ordinary Vs Special Damages", ["A-I, B-II, C-III, D-IV", "A-III, B-I, C-IV, D-II", "A-II, B-III, C-I, D-IV", "A-III, B-II, C-IV, D-I"], 1, "UGC NET June 2026, Q67. Correct answer: option B (A-III, B-I, C-IV, D-II)."], [11, "Match the LIST-I with LIST-II<br>LIST-I (Class of Digital Signature)<br>A. Class 0 Certificate<br>B. Class 1 Certificate<br>C. Class 2 Certificate<br>D. Class 3 Certificate<br>LIST-II (Description)<br>I. High assurance certificates where individuals are required to be physically present before the Certifying Authority.<br>II. Information provided by subscriber is in sync with the information in well-recognized consumer databases.<br>III. Issued only for demonstration purposes.<br>IV. User’s name and e-mail address form an unambiguous subject within the Certifying Authorities database.", ["A-I, B-II, C-IV, D-III", "A-III, B-IV, C-II, D-I", "A-I, B-II, C-III, D-IV", "A-IV, B-III, C-II, D-I"], 1, "UGC NET June 2026, Q68. Correct answer: option B (A-III, B-IV, C-II, D-I)."], [11, "A minor who owns property requires an advocate for necessary legal defence in a criminal proceeding. Mr. Rahul pays reasonable legal fees of Rs. 10,000 directly to the advocate on the minor’s behalf. Under Section 68 of the Indian Contract Act, 1872, which remedy is available if the amount is not reimbursed?", ["As the agreement with a minor is void ab initio, Mr. Rahul cannot recover the amount from the minor.", "The amount can be recovered from the minor after attaining his age of majority.", "Mr. Rahul can recover the amount from the guardian of the minor.", "Mr. Rahul may recover the reasonable cost of these necessary legal services from the minor’s property, not from the minor personally."], 3, "UGC NET June 2026, Q69. Correct answer: option D (Mr. Rahul may recover the reasonable cost of these necessary legal services from the minor…)."], [11, "Which of the following is the example of Agency by estoppel?", ["A tells B in the presence and within hearing distance of Q that he is Q’s agent. Q doesn’t contradict the statement. Later on B enters into a contract with A, honestly presuming that A is Q’s Agent. Q will be bound by this contract.", "Q allows his servant to purchase certain goods from B’s shop on credit and later he pays for the goods. The transactions were done many times. Later on, the servant was fired out, but he purchased goods on Q’s c px;line-height:1.5;color:var(--mute);margin:0 0 12px\">The World Bank Group consists of five closely associated institutions, all owned by member countries that carry the ultimate decision-making power. Each institution plays a distinct role in the mission to fight poverty and improve living standards for people in the developing world. The term ‘World Bank Group’ encompasses all the five institutions, while the term ‘World Bank’ refers specifically to IBRD and IDA out of the five. The World Bank is a vital source of financial and technical assistance to developing countries around the world. The World Bank is run like a co-operative, with member countries as its shareholders. The number of shares a country has is based roughly on the size of its economy. The International Bank for Reconstruction and Development (IBRD) is the oldest of the World Bank Group institutions established in 1944 to help Europe recover from the devastation of World War II. Subsequently, it shifted its attention to developing countries. It aims to reduce poverty in middle-income and creditworthy poor countries by promoting sustainable development through loans, guarantees, risk management products, and (non- lending) analytic and advisory services. Established in 1960, the International Development Association (IDA) provides interest-free credits and grants to the poorest developing countries in order to boost their economic growth and improve people’s living conditions. IDA funds help these countries deal with the complex challenges they face in striving to meet the Millennium Development Goals (MDGs). It helps to reduce inequalities both across and within countries by allowing more people to participate in the mainstream economy, reducing poverty, and promoting more equal access to the opportunities. The private sector arm of the World Bank Group, the International Finance Corporation (IFC) was founded in 1956. It promotes sustainable private sector investment in developing countries, helping to reduce poverty and improve people’s lives. The IFC is owned by its 179 member countries with an authorized capital of US $2.45 billion. To be eligible for IFC financing, projects must be profitable for investors, benefit the economy of the host country, and comply with stringent social and environmental guidelines. Further, the Multilateral Investment Guarantee Agency (MIGA) provides non-commercial guarantees for FDI in developing countries. It was established in 1988 and presently has 172 members. The MIGA provides private investors the confidence and comfort they need to make sustainable investments in developing countries. Founded in 1966, the International Centre for Settlement of Investment Dispute (ICSID) was designed to facilitate the settlement of investment disputes between foreign investors and host states. It is headquartered in Washington DC and its administrative council is chaired by the World Bank’s presidents. During the recent years, the caseload of the ICSID has increased considerably mainly due to the proliferation of international investment treaties.</span>The International Development Association (IDA) established in 1960 aims at:", ["Reducing political conflicts among countries", "Funding countries to deal with complex challenges in International Trade", "Promoting more equal access to the opportunities created by economic growth.", "Promoting International peace"], 2, "UGC NET June 2026, Q91. Correct answer: option C (Promoting more equal access to the opportunities created by economic growth.)."], [3, "<span style=\"display:block;font-weight:400;font-size:14px;line-height:1.5;color:var(--mute);margin:0 0 12px\">The World Bank Group consists of five closely associated institutions, all owned by member countries that carry the ultimate decision-making power. Each institution plays a distinct role in the mission to fight poverty and improve living standards for people in the developing world. The term ‘World Bank Group’ encompasses all t  Untouchables speak Marathi (the regional Indo-European language surrounding Kupwar and the principal literary language of the area). These groups have lived in the village for centuries, and most men are bilingual or multilingual. Over the course of time, with individual switching back and forth among at least two of these languages, the varieties used in Kupwar have come to be more and more alike. In fact, the grammatical structures of the village varieties are now so similar that a word-for-word translation is possible among the languages because word order and other structural characteristics of the three languages are now virtually identical. This merging is remarkable because the varieties of these languages that are used elsewhere are very different from one another.</span>Kannada, Urdu and Marathi all over the world are known as languages :", ["that are very different from each other", "that are very similar to each other", "that are easy to learn", "that belong to the same language family"], 0, "UGC NET Paper 1, 9 Sept 2026 (Evening), Q.46. Official answer key: option 1."], [0, "<span style=\"display:block;font-weight:400;font-size:14px;line-height:1.5;color:var(--mute);margin:0 0 12px\">Just as physical and social distance enable speakers of one variety to distinguish themselves from speakers of other varieties, so close contact and frequent communication foster linguistic similarity. As varieties of the same language spoken by people in close social contact tend to become alike, different languages spoken in a community may also tend to merge. Kupwar is a village in India on the border between two major language families: the Indo-European family (which includes the languages of North India) and the unrelated Dravidian family (the languages of South India). Kupwar’s 3,000 inhabitants fall into three groups and regularly use three languages in their daily activities. The Jains speak Kannada (a Dravidian language), the Muslims speak Urdu (an Indo-European l
